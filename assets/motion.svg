<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Hi, I&#x27;m Jihoo">
  <title>Hi, I&#x27;m Jihoo</title>
  <defs>
    <clipPath id="frame"><rect width="900" height="300" rx="16"/></clipPath>
    <clipPath id="nameMask"><rect x="0" y="77.5" width="900" height="95.8"/></clipPath>
    <clipPath id="subMask"><rect x="299.6" y="178" width="300.8" height="29"/></clipPath>
  </defs>
  <style>
    .a      { animation: 12s linear infinite; animation-delay: calc(var(--d, 0s) - 12s); }
    .c      { transform-box: fill-box; transform-origin: center; }
    .bar    { animation-name: bar; transform: translateY(300px); }
    .iris   { animation-name: iris; transform: scale(0); transform-origin: 450.0px 150.0px; }
    .letter { animation-name: letter; font: 800 76.0px ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #0d1117; }
    .hl     { fill: #7f5af0; }
    .mark   { animation-name: mark; transform-box: fill-box; transform-origin: left center; }
    .block  { animation-name: block; transform: translateX(-303px); }
    .sub    { animation-name: sub; font: 600 18px ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #0d1117; }
    .chip   { animation-name: chip; }
    .tag    { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .dot    { animation-name: dot; }
    .ring   { animation-name: ring; fill: none; stroke: #7f5af0; stroke-width: 10; stroke-linecap: round; stroke-dasharray: 75 100; }
    .tri    { animation-name: tri; }
    .plus   { animation-name: plus; fill: none; stroke: #0d1117; stroke-width: 6; stroke-linecap: round; }
    .ball   { animation-name: ball; }
    .draw   { animation-name: draw; fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100 100; }
    .half   { animation-name: half; }
    .prog   { animation-name: prog; transform-origin: 0 0; }
    @keyframes bar { 0.00% { transform: translateY(300px); } 1.25% { transform: translateY(300px); animation-timing-function: cubic-bezier(.16,1,.3,1); } 5.42% { transform: translateY(0); } 9.17% { transform: translateY(0); animation-timing-function: cubic-bezier(.76,0,.24,1); } 13.75% { transform: translateY(-300px); } 100.00% { transform: translateY(-300px); } }
    @keyframes iris { 0.00% { transform: scale(1); } 8.75% { transform: scale(1); } 8.83% { transform: scale(0); } 91.25% { transform: scale(0); animation-timing-function: cubic-bezier(.76,0,.24,1); } 97.08% { transform: scale(1); } 100.00% { transform: scale(1); } }
    @keyframes letter { 0.00% { transform: translateY(95px); } 12.50% { transform: translateY(95px); animation-timing-function: cubic-bezier(.16,1,.3,1); } 19.17% { transform: translateY(0); } 51.67% { transform: translateY(0); animation-timing-function: cubic-bezier(.16,1,.3,1); } 53.50% { transform: translateY(-12px); animation-timing-function: ease-in; } 55.83% { transform: translateY(0); } 84.17% { transform: translateY(0); animation-timing-function: cubic-bezier(.7,0,.84,0); } 88.33% { transform: translateY(-95px); } 100.00% { transform: translateY(-95px); } }
    @keyframes mark { 0.00% { transform: scaleX(0); } 18.33% { transform: scaleX(0); animation-timing-function: cubic-bezier(.16,1,.3,1); } 24.17% { transform: scaleX(1); } 83.33% { transform: scaleX(1); animation-timing-function: cubic-bezier(.7,0,.84,0); } 87.08% { transform: scaleX(0); } 100.00% { transform: scaleX(0); } }
    @keyframes block { 0.00% { transform: translateX(-303px); } 21.67% { transform: translateX(-303px); animation-timing-function: cubic-bezier(.16,1,.3,1); } 24.83% { transform: translateX(0); animation-timing-function: cubic-bezier(.7,0,.84,0); } 28.00% { transform: translateX(303px); } 100.00% { transform: translateX(303px); } }
    @keyframes sub { 0.00% { opacity: 0; } 24.75% { opacity: 0; } 24.83% { opacity: 1; } 45.31% { opacity: 1; } 45.39% { opacity: 0; } 100.00% { opacity: 0; } }
    @keyframes chip { 0.00% { transform: scale(0); } 26.67% { transform: scale(0); animation-timing-function: cubic-bezier(.34,1.56,.64,1); } 30.42% { transform: scale(1); } 66.67% { transform: scale(1); animation-timing-function: cubic-bezier(.16,1,.3,1); } 68.17% { transform: scale(1.14); animation-timing-function: ease-in-out; } 70.42% { transform: scale(1); } 82.50% { transform: scale(1); animation-timing-function: cubic-bezier(.7,0,.84,0); } 85.42% { transform: scale(0); } 100.00% { transform: scale(0); } }
    @keyframes dot { 0.00% { transform: scale(0); } 15.83% { transform: scale(0); animation-timing-function: cubic-bezier(.34,1.56,.64,1); } 19.17% { transform: scale(1); } 83.33% { transform: scale(1); animation-timing-function: cubic-bezier(.7,0,.84,0); } 85.83% { transform: scale(0); } 100.00% { transform: scale(0); } }
    @keyframes ring { 0.00% { stroke-dashoffset: 75; transform: rotate(-90deg); } 13.33% { stroke-dashoffset: 75; transform: rotate(-90deg); animation-timing-function: cubic-bezier(.16,1,.3,1); } 20.83% { stroke-dashoffset: 0; transform: rotate(0deg); } 83.33% { stroke-dashoffset: 0; transform: rotate(230deg); animation-timing-function: cubic-bezier(.7,0,.84,0); } 87.50% { stroke-dashoffset: -100; transform: rotate(300deg); } 100.00% { stroke-dashoffset: -100; transform: rotate(300deg); } }
    @keyframes tri { 0.00% { transform: scale(0) rotate(-200deg); } 15.00% { transform: scale(0) rotate(-200deg); animation-timing-function: cubic-bezier(.16,1,.3,1); } 21.67% { transform: scale(1) rotate(0deg); } 83.33% { transform: scale(1) rotate(240deg); animation-timing-function: cubic-bezier(.7,0,.84,0); } 86.67% { transform: scale(0) rotate(360deg); } 100.00% { transform: scale(0) rotate(360deg); } }
    @keyframes plus { 0.00% { transform: scale(0) rotate(-180deg); } 16.67% { transform: scale(0) rotate(-180deg); animation-timing-function: cubic-bezier(.34,1.56,.64,1); } 21.67% { transform: scale(1) rotate(0deg); } 83.33% { transform: scale(1) rotate(270deg); animation-timing-function: cubic-bezier(.7,0,.84,0); } 86.25% { transform: scale(0) rotate(360deg); } 100.00% { transform: scale(0) rotate(360deg); } }
    @keyframes ball { 0.00% { transform: translateY(-90px); } 14.17% { transform: translateY(-90px); animation-timing-function: cubic-bezier(.5,0,1,.5); } 17.08% { transform: translateY(0); animation-timing-function: cubic-bezier(.16,1,.3,1); } 19.58% { transform: translateY(-26px); animation-timing-function: cubic-bezier(.5,0,1,.5); } 21.67% { transform: translateY(0); animation-timing-function: cubic-bezier(.16,1,.3,1); } 22.92% { transform: translateY(-8px); animation-timing-function: cubic-bezier(.5,0,1,.5); } 24.00% { transform: translateY(0); } 36.11% { transform: translateY(0px); animation-timing-function: ease-in-out; } 47.92% { transform: translateY(-6px); animation-timing-function: ease-in-out; } 59.72% { transform: translateY(0px); animation-timing-function: ease-in-out; } 71.53% { transform: translateY(-6px); animation-timing-function: ease-in-out; } 83.33% { transform: translateY(0); animation-timing-function: cubic-bezier(.7,0,.84,0); } 86.67% { transform: translateY(-90px); } 100.00% { transform: translateY(-90px); } }
    @keyframes draw { 0.00% { stroke-dashoffset: 100; } 17.50% { stroke-dashoffset: 100; animation-timing-function: cubic-bezier(.76,0,.24,1); } 24.17% { stroke-dashoffset: 0; } 83.33% { stroke-dashoffset: 0; animation-timing-function: cubic-bezier(.7,0,.84,0); } 86.67% { stroke-dashoffset: -100; } 100.00% { stroke-dashoffset: -100; } }
    @keyframes half { 0.00% { transform: translateX(60px); } 14.17% { transform: translateX(60px); animation-timing-function: cubic-bezier(.16,1,.3,1); } 20.00% { transform: translateX(0); } 83.33% { transform: translateX(0); animation-timing-function: cubic-bezier(.7,0,.84,0); } 86.67% { transform: translateX(60px); } 100.00% { transform: translateX(60px); } }
    @keyframes prog { 0.00% { transform: scaleX(0); } 12.50% { transform: scaleX(0); } 88.33% { transform: scaleX(1); } 90.83% { transform: scaleX(1); opacity: 1; } 91.25% { transform: scaleX(1); opacity: 0; } 100.00% { transform: scaleX(1); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; }  }
  </style>
